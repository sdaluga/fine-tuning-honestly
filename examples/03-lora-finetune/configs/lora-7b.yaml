# A defensible starting point for instruction adaptation on a 7-8B base.
#
# Every value here is a decision with a reason attached in train_lora.py.
# Change one at a time: move two and you cannot attribute the result.

base_model: meta-llama/Meta-Llama-3.1-8B-Instruct

# Paths are relative to this config file, so a config is self-contained and
# a run is reproducible from the config alone.
train_file: ../../02-curate-a-dataset/data/train.jsonl
eval_file: ../../02-curate-a-dataset/data/eval.jsonl
output_dir: ./output/lora-7b

# --- LoRA ---------------------------------------------------------------
rank: 16              # 8-16 covers most style and format adaptation
alpha: 32             # convention: 2 * rank
dropout: 0.05
target_modules:       # attention + MLP; drop the MLP three if only restyling
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# --- Optimisation --------------------------------------------------------
learning_rate: 0.0001 # ~10x a full fine-tune; only the adapters move
epochs: 3             # beyond ~3 on a curated set you are memorising
batch_size: 4
grad_accum: 4         # effective batch 16
max_seq_len: 2048
warmup_ratio: 0.03
load_in_4bit: true    # QLoRA — fits a 7B tune on one 24GB card
seed: 42
